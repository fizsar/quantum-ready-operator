# This rule is not used by the project quantum-ready-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to security.fizsar.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: quantum-ready-operator
    app.kubernetes.io/managed-by: kustomize
  name: cryptoaudit-viewer-role
rules:
- apiGroups:
  - security.fizsar.github.io
  resources:
  - cryptoaudits
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - security.fizsar.github.io
  resources:
  - cryptoaudits/status
  verbs:
  - get
