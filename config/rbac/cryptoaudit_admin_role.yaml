# This rule is not used by the project quantum-ready-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over security.fizsar.github.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: quantum-ready-operator
    app.kubernetes.io/managed-by: kustomize
  name: cryptoaudit-admin-role
rules:
- apiGroups:
  - security.fizsar.github.io
  resources:
  - cryptoaudits
  verbs:
  - '*'
- apiGroups:
  - security.fizsar.github.io
  resources:
  - cryptoaudits/status
  verbs:
  - get
